ui:
  bundle:
    url: ./src/ui-bundle.zip
    snapshot: true
  supplemental_files: ./src/supplemental-ui
  output_dir: ui

asciidoc:
  attributes:
    allow-uri-read: true
    page-pagination: true
    experimental: ''
    idprefix: '_'
    idseparator: '_'
    sectanchors: ''
    sectlinks: ''
    linkattrs: ''
    source-highlighter: rouge
    rouge-style: github
    bibtex-file: resources/references.bib
    bibtex-style: ieee                   # Citation style
    bibtex-order: appearance             # Citation ordering
    bibtex-format: asciidoc              # Output format
    bibtex-locale: en-US                 # Locale
    bibtex-throw: false                  # Error handling
    # Kroki: render diagrams at build time and embed local SVG, instead of
    # emitting kroki.io URLs that the browser fetches at view time. Removes
    # runtime dependency on kroki.io and avoids per-visitor rate limits.
    kroki-fetch-diagram: true
    kroki-default-format: svg
  extensions:
    - asciidoctor-kroki
    - '@asciidoctor/tabs'
    - '@ayowel/asciidoctor-bibtex-js'
    - './src/extensions/auto-bibtex-references.js'

runtime:
  fetch: true
  cache_dir: ./.cache/antora
  log:
    failure_level: warn

output:
  dir: ./build
  clean: true

urls:
  html_extension_style: indexify
  latest_version_segment_strategy: redirect:from
  latest_version_segment: latest
  latest_prerelease_version_segment: development
