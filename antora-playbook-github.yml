antora:
  extensions:
    - require: '@antora/lunr-extension'
      index_latest_only: true
      index_by_heading: true
      snippet_length: 80
    - require: './src/extensions/scoped-search-index.js'
    - require: './src/extensions/patch-asciidoctor-bibtex-lines.js'
    - require: './src/extensions/display-versions.js'
    - require: './src/extensions/load-global-vars.js'
      var_files: ['./resources/global-vars.yml']
    - require: './src/extensions/resolve-class-links.js'

site:
  title: openEHR Specifications
  url: https://sebastian-iancu.github.io/antora-openehr/
#  url: http://localhost:8080
  start_page: BASE::index.adoc

content:
  sources:
    # BASE Component - Foundation specifications
    - url: repos/specifications-BASE
      branches:
        - development
        - 'release/1.1.0'
        - 'release/1.2.0'
      version:
        release/(?<version>+({0..9}).+({0..9}).+({0..9})): Release-$<version>
        development: development

    # RM Component - Reference Model
    - url: repos/specifications-RM
      branches:
        - development
        - 'release/1.0.4'
        - 'release/1.1.0'
      version:
        release/(?<version>+({0..9}).+({0..9}).+({0..9})): Release-$<version>
        development: development

    # AM Component - Archetype Model
    - url: repos/specifications-AM
      branches:
        - development
        - 'release/1.4.0'
        - 'release/2.2.0'
        - 'release/2.3.0'
      version:
        release/(?<version>+({0..9}).+({0..9}).+({0..9})): Release-$<version>
        development: development

    # LANG Component - Languages (AQL, EL, ODIN, etc.)
    - url: repos/specifications-LANG
      branches:
        - development
        - 'release/1.0.0'
      version:
        release/(?<version>+({0..9}).+({0..9}).+({0..9})): Release-$<version>
        development: development

    # SM Component - Service Model
    - url: repos/specifications-SM
      branches:
        - development
      version:
        release/(?<version>+({0..9}).+({0..9}).+({0..9})): Release-$<version>
        development: development

    # QUERY Component - Query specifications
    - url: repos/specifications-QUERY
      branches:
        - development
