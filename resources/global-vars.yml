# Global AsciiDoc attributes injected into every page at build time via load-global-vars.js.
#
# PURPOSE: compatibility shim for upstream openEHR repos that use {class_*} and {page_*}
# attribute syntax instead of native Antora xrefs. These repos cannot be modified,
# so their cross-component references are resolved here centrally.
#
# If you are writing new content in this repo, use native Antora xrefs directly:
#   xref:LANG:bmm:core-types.adoc#_bmm_type_class[BMM_TYPE]
# You do not need to add entries here for your own content.
#
# Note: Keys mirror AsciiDoc attributes. Values may reference other attributes
# using {attr} syntax, which Asciidoctor will resolve at use time.

